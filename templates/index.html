<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKERS3D</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="info">
        <h1>HACKERS3D</h1>
        <div id="hover-info">Hover over a node to inspect it</div>
        <div id="controls-info">WASD / Mouse: fly  •  SPACE: up  •  SHIFT+SPACE: down  •  SHIFT: boost  •  R: rename  •  DELETE: delete</div>
    </div>
    <div id="search-container">
        <input type="text" id="search-bar" placeholder="Search filesystem..." autocomplete="off">
        <div id="search-results"></div>
    </div>
    <div id="crosshair">+</div>
    <div id="container"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/geometries/TextGeometry.js"></script>\n    <script src="https://cdn.jsdelivr.net/npm/d3-dispatch@3"></script>\n    <script src="https://cdn.jsdelivr.net/npm/d3-quadtree@3"></script>\n    <script src="https://cdn.jsdelivr.net/npm/d3-timer@3"></script>\n    <script src="https://cdn.jsdelivr.net/npm/d3-force@3"></script>\n    <script src="https://cdn.jsdelivr.net/npm/d3-binarytree"></script>\n    <script src="https://cdn.jsdelivr.net/npm/d3-octree"></script>\n    <script src="https://cdn.jsdelivr.net/npm/d3-force-3d@3.0.6"></script>
    <script src="/static/visualizer.js"></script>
</body>
</html>
